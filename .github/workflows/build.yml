name: Build APK + iOS

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - name: Generate Android platform (v2 embedding)
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib && cp pubspec.yaml /tmp/keep/pubspec.yaml
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/keep/gs.json; fi
          rm -rf android
          flutter create --platforms=android --project-name fanni_app --org com.example.fanni .
          rm -rf lib && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
          if [ -f /tmp/keep/gs.json ]; then cp /tmp/keep/gs.json android/app/google-services.json; fi
          # firebase-auth الجديد يتطلب Kotlin 2.2+
          sed -i 's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "2.2.0"/' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android") version "2.2.0"' android/settings.gradle.kts
          # firebase-auth يتطلب minSdk >= 23 (يدعم Groovy و Kotlin DSL)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk.*/minSdk = 23/' android/app/build.gradle.kts
            grep -q "minSdk = 23" android/app/build.gradle.kts
            # flutter_local_notifications يتطلب desugaring
            sed -i 's/sourceCompatibility = JavaVersion.VERSION_11/sourceCompatibility = JavaVersion.VERSION_11\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            grep -q "isCoreLibraryDesugaringEnabled = true" android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          else
            sed -i 's/minSdk.*/minSdkVersion 23/' android/app/build.gradle
            grep -q "minSdkVersion 23" android/app/build.gradle
            sed -i 's/sourceCompatibility.*/sourceCompatibility = "11"\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> android/app/build.gradle
          fi
          # صلاحيات الموقع لزرار الموقع الحالي
          sed -i 's|<application|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          # السماح باكتشاف تطبيقات الخرائط (زرار افتح في الخرائط)
          sed -i 's|    <application|    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="geo" />\n        </intent>\n    </queries>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q "<queries>" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: App icon + name
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          sed -i 's/android:label="[^"]*"/android:label="فنيّات"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Generate iOS platform
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib && cp pubspec.yaml /tmp/keep/pubspec.yaml
          if [ -f ios/Runner/GoogleService-Info.plist ]; then cp ios/Runner/GoogleService-Info.plist /tmp/keep/plist; fi
          rm -rf ios
          flutter create --platforms=ios --project-name fanni_app --org com.example.fanni .
          rm -rf lib && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
          if [ -f /tmp/keep/plist ]; then cp /tmp/keep/plist ios/Runner/GoogleService-Info.plist; fi
          # cloud_firestore يتطلب iOS 15+ (ملاحظة: sed على macOS يحتاج -i '')
          sed -i '' -E "s/#? *platform :ios.*$/platform :ios, '15.0'/" ios/Podfile
          grep -q "platform :ios, '15.0'" ios/Podfile || (head -8 ios/Podfile; exit 1)
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-9]\.[0-9]/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj || true
      - run: flutter pub get
      - name: Update CocoaPods specs (latest Firebase)
        run: |
          cd ios && pod repo update
          # دمج إعداد Swift 5 داخل post_install الموجود (لا يسمح بتكراره)
          sed -i '' 's|    flutter_additional_ios_build_settings(target)|    flutter_additional_ios_build_settings(target)\n    if target.name == '"'"'FirebaseSharedSwift'"'"'\n      target.build_configurations.each do \|config\|\n        config.build_settings['"'"'SWIFT_VERSION'"'"'] = '"'"'5.0'"'"'\n      end\n    end|' Podfile
          grep -q "FirebaseSharedSwift" Podfile
      - name: App icon iOS
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version
      - run: flutter build ios --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-no-codesign
          path: build/ios/iphoneos
