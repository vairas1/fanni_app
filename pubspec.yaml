name: fanni_app
description: تطبيق خدمات فنية - واجهة عملاء وفنيين مع حجز وخريطة ودردشة وتقييمات وإشعارات FCM.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  audioplayers: ^5.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.wav
    - assets/bg.png
